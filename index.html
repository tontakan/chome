<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Manager Pro - Full File Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .file-selected { background-color: #eef2ff !important; border-left: 4px solid #4f46e5 !important; }
        .batch-mode { background-color: #fffbeb; border: 2px dashed #f59e0b; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 select-none overflow-hidden h-screen flex">

    <!-- Sidebar -->
    <aside class="w-80 bg-slate-50/95 backdrop-blur-xl border-r border-slate-200 flex flex-col shrink-0">
        <div class="p-6 flex items-center gap-4 border-b border-slate-200/50">
            <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-indigo-100">
                <i data-lucide="folder-cog" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight leading-none">PC Manager Pro</h1>
                <p class="text-[10px] text-indigo-500 font-black uppercase mt-1 tracking-widest italic">Full Operations</p>
            </div>
        </div>

        <div class="p-5 flex-1 space-y-6 overflow-y-auto custom-scrollbar">
            <!-- Action Tools -->
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-new-folder" class="flex flex-col items-center gap-2 p-3 bg-white border border-slate-200 rounded-2xl hover:bg-slate-50 transition-all shadow-sm">
                    <i data-lucide="folder-plus" class="w-5 h-5 text-indigo-500"></i>
                    <span class="text-[10px] font-bold">โฟลเดอร์ใหม่</span>
                </button>
                <button id="btn-batch-rename" class="flex flex-col items-center gap-2 p-3 bg-white border border-slate-200 rounded-2xl hover:bg-slate-50 transition-all shadow-sm disabled:opacity-50">
                    <i data-lucide="list-ordered" class="w-5 h-5 text-amber-500"></i>
                    <span class="text-[10px] font-bold">เปลี่ยนชื่อกลุ่ม</span>
                </button>
            </div>

            <!-- Path Control -->
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">ตำแหน่งปัจจุบัน</span>
                    <button id="btn-back" class="p-1 hover:bg-slate-100 rounded-lg text-slate-400 disabled:opacity-30" title="ย้อนกลับ">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                </div>
                <textarea id="target-path-input" rows="2" class="w-full p-3 bg-slate-50 rounded-2xl border border-slate-100 font-mono text-[10px] text-slate-500 leading-relaxed outline-none focus:ring-2 focus:ring-indigo-100 resize-none">C:\Users\2539\Downloads\หนังสือประวัติศาสตร์ใหม่</textarea>
                <button id="btn-connect" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl flex items-center justify-center gap-2 transition-all shadow-lg active:scale-95 group">
                    <i data-lucide="link" class="w-4 h-4"></i>
                    <span>เชื่อมต่อเป้าหมาย</span>
                </button>
            </div>

            <div id="sandbox-alert" class="hidden p-4 bg-amber-50 border border-amber-200 rounded-2xl space-y-2">
                <p class="text-[10px] font-bold text-amber-700 leading-tight">โหมด Sandbox: ใช้การจำลองเพื่อทดสอบ</p>
                <button id="btn-simulate" class="w-full bg-amber-600 text-white text-[10px] py-2 rounded-xl font-bold">เปิดโหมดจำลอง</button>
            </div>

            <nav class="space-y-1">
                <p class="px-4 text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Clipboard</p>
                <div class="grid grid-cols-3 gap-1 px-2">
                    <button id="btn-cut" class="p-2 bg-white border border-slate-100 rounded-xl text-slate-500 hover:text-indigo-600 transition-all" title="ตัด"><i data-lucide="scissors" class="w-4 h-4 m-auto"></i></button>
                    <button id="btn-copy" class="p-2 bg-white border border-slate-100 rounded-xl text-slate-500 hover:text-indigo-600 transition-all" title="คัดลอก"><i data-lucide="copy" class="w-4 h-4 m-auto"></i></button>
                    <button id="btn-paste" class="p-2 bg-white border border-slate-100 rounded-xl text-slate-500 hover:text-indigo-600 transition-all disabled:opacity-30" title="วาง" disabled><i data-lucide="clipboard-paste" class="w-4 h-4 m-auto"></i></button>
                </div>
            </nav>
        </div>

        <div class="p-5 border-t border-slate-200 bg-white/50">
           <div class="flex items-center gap-3">
              <div id="sync-indicator" class="w-3 h-3 rounded-full bg-slate-300"></div>
              <div class="flex-1 min-w-0">
                <p class="text-xs font-black text-slate-700 truncate">SYSTEM STATUS</p>
                <p id="status-text" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest italic">Waiting</p>
              </div>
           </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 bg-white m-3 rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden relative">
        <header class="h-20 border-b border-slate-100 flex items-center px-10 justify-between gap-10 bg-slate-50/40">
            <div class="flex-1 max-w-2xl relative group">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5 transition-colors group-focus-within:text-indigo-500"></i>
                <input id="search-input" type="text" placeholder="ค้นหา... (F2: เปลี่ยนชื่อ, Delete: ลบ, Ctrl+คลิก: เลือกหลายไฟล์)" class="w-full bg-white border border-slate-200 rounded-2xl py-3.5 pl-14 pr-6 text-sm font-medium focus:ring-4 focus:ring-indigo-50 focus:border-indigo-400 outline-none transition-all shadow-sm">
            </div>

            <div class="flex items-center gap-3">
                <div id="selection-counter" class="hidden px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-full animate-pulse">0 เลือกอยู่</div>
                <div class="flex bg-white p-1.5 rounded-2xl border border-slate-200 shadow-sm shrink-0">
                    <button id="view-list" class="p-2.5 rounded-xl transition-all bg-indigo-50 text-indigo-600 shadow-inner"><i data-lucide="list" class="w-5 h-5"></i></button>
                    <button id="view-grid" class="p-2.5 rounded-xl transition-all text-slate-400 hover:bg-slate-50"><i data-lucide="layout-grid" class="w-5 h-5"></i></button>
                </div>
            </div>
        </header>

        <div id="explorer-body" class="flex-1 overflow-auto p-8 custom-scrollbar" onclick="clearSelection(event)">
            <!-- Empty State -->
            <div id="empty-state" class="h-full flex flex-col items-center justify-center text-slate-300">
                <i data-lucide="folder-search" class="w-20 h-20 mb-4 opacity-20"></i>
                <h3 class="text-xl font-black text-slate-400">ยังไม่ได้เชื่อมต่อตำแหน่ง</h3>
            </div>

            <div id="files-view" class="hidden">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 id="folder-name-display" class="text-2xl font-black text-slate-800 tracking-tight">กำลังโหลด...</h2>
                        <div id="breadcrumbs" class="flex items-center gap-1 text-[10px] text-slate-400 font-bold mt-1"></div>
                    </div>
                </div>
                
                <table id="table-view" class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] border-b border-slate-50">
                            <th class="px-6 py-4">ชื่อไฟล์</th>
                            <th class="px-6 py-4">สถานะ</th>
                            <th class="px-6 py-4">ขนาด</th>
                            <th class="px-6 py-4 text-right">แอคชั่น</th>
                        </tr>
                    </thead>
                    <tbody id="file-rows" class="divide-y divide-slate-50"></tbody>
                </table>
                <div id="grid-view" class="hidden grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-7 gap-6"></div>
            </div>
        </div>

        <!-- Toolbar Floating -->
        <div id="floating-actions" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-slate-900/90 backdrop-blur text-white p-2 rounded-2xl shadow-2xl border border-white/10">
            <button id="btn-mark-read" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-xl text-xs font-bold flex items-center gap-2 transition-all"><i data-lucide="check-circle" class="w-4 h-4"></i> อ่านแล้ว</button>
            <button id="btn-mark-edited" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-xl text-xs font-bold flex items-center gap-2 transition-all"><i data-lucide="edit-3" class="w-4 h-4"></i> แก้ไขแล้ว</button>
            <div class="w-px h-6 bg-white/20 mx-1"></div>
            <button id="btn-delete-multi" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-xl text-xs font-bold flex items-center gap-2 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i> ลบ</button>
        </div>

        <footer class="h-14 bg-slate-50/80 backdrop-blur border-t border-slate-100 px-10 flex items-center justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest">
            <div class="flex gap-10 items-center">
                <span id="footer-path-display">DISCONNECTED</span>
                <span class="text-indigo-600">F2: Rename | Delete: Remove | Ctrl: Multi-select</span>
            </div>
            <div id="clipboard-status" class="hidden text-amber-600 items-center gap-2">
                <i data-lucide="scissors" class="w-3 h-3"></i> <span id="clipboard-text">มีไฟล์ในคลิปบอร์ด</span>
            </div>
        </footer>
    </main>

    <script>
        // --- State ---
        let allFiles = [];
        let selectedFileIds = new Set();
        let dirHandle = null;
        let historyHandles = []; // เพื่อย้อนกลับ
        let isSimulated = false;
        let clipboard = { type: null, handles: [] }; // type: 'cut' | 'copy'
        let fileStatus = JSON.parse(localStorage.getItem('pc_manager_status') || '{}');

        // --- Elements ---
        const els = {
            btnConnect: document.getElementById('btn-connect'),
            btnSimulate: document.getElementById('btn-simulate'),
            btnBack: document.getElementById('btn-back'),
            btnNewFolder: document.getElementById('btn-new-folder'),
            btnBatchRename: document.getElementById('btn-batch-rename'),
            btnCut: document.getElementById('btn-cut'),
            btnCopy: document.getElementById('btn-copy'),
            btnPaste: document.getElementById('btn-paste'),
            btnMarkRead: document.getElementById('btn-mark-read'),
            btnMarkEdited: document.getElementById('btn-mark-edited'),
            btnDeleteMulti: document.getElementById('btn-delete-multi'),
            searchInput: document.getElementById('search-input'),
            fileRows: document.getElementById('file-rows'),
            gridView: document.getElementById('grid-view'),
            emptyState: document.getElementById('empty-state'),
            filesView: document.getElementById('files-view'),
            folderName: document.getElementById('folder-name-display'),
            statusText: document.getElementById('status-text'),
            syncIndicator: document.getElementById('sync-indicator'),
            selectionCounter: document.getElementById('selection-counter'),
            floatingActions: document.getElementById('floating-actions'),
            pathInput: document.getElementById('target-path-input'),
            clipboardStatus: document.getElementById('clipboard-status')
        };

        // --- Core Functions ---

        async function connectPC() {
            try {
                const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                historyHandles = [];
                dirHandle = handle;
                isSimulated = false;
                await refreshFiles();
            } catch (err) {
                if (err.name === 'SecurityError') document.getElementById('sandbox-alert').classList.remove('hidden');
            }
        }

        async function refreshFiles() {
            if (!dirHandle) return;
            const files = [];
            for await (const entry of dirHandle.values()) {
                const type = entry.kind;
                let size = "---";
                let updatedAt = "---";
                
                if (type === 'file') {
                    const file = await entry.getFile();
                    size = (file.size / 1024).toFixed(1) + ' KB';
                    updatedAt = new Date(file.lastModified).toLocaleDateString('th-TH');
                }

                files.push({
                    id: entry.name,
                    name: entry.name,
                    kind: type,
                    ext: entry.name.split('.').pop().toLowerCase(),
                    updatedAt,
                    size,
                    handle: entry,
                    status: fileStatus[entry.name] || 'none'
                });
            }
            allFiles = files;
            selectedFileIds.clear();
            renderAll();
            updateUI();
        }

        function renderAll() {
            const term = els.searchInput.value.toLowerCase();
            const filtered = allFiles.filter(f => f.name.toLowerCase().includes(term));
            
            els.fileRows.innerHTML = filtered.map(file => `
                <tr id="row-${file.id}" class="group transition-all cursor-default ${selectedFileIds.has(file.id) ? 'file-selected' : 'hover:bg-slate-50'}" 
                    onclick="handleFileClick(event, '${file.id}')" ondblclick="handleDoubleClick('${file.id}')">
                    <td class="px-6 py-4 flex items-center gap-4">
                        <div class="p-2 bg-white rounded-xl shadow-sm border border-slate-100">${getIcon(file)}</div>
                        <span class="text-sm font-bold text-slate-700">${file.name}</span>
                    </td>
                    <td class="px-6 py-4">${getStatusBadge(file.status)}</td>
                    <td class="px-6 py-4 text-[10px] font-bold text-slate-400">${file.size}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="modifySingle('${file.id}')" class="p-2 hover:text-indigo-600 transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            `).join('');

            els.gridView.innerHTML = filtered.map(file => `
                <div id="grid-${file.id}" class="flex flex-col items-center p-5 rounded-[2rem] border-2 transition-all cursor-default ${selectedFileIds.has(file.id) ? 'file-selected' : 'border-transparent hover:bg-slate-50'}"
                    onclick="handleFileClick(event, '${file.id}')" ondblclick="handleDoubleClick('${file.id}')">
                    <div class="mb-3">${getIcon(file, 48)}</div>
                    <span class="text-[10px] font-bold text-center break-all line-clamp-2">${file.name}</span>
                    ${file.status !== 'none' ? `<div class="mt-1">${getStatusBadge(file.status, true)}</div>` : ''}
                </div>
            `).join('');

            updateCounters();
            lucide.createIcons();
        }

        function handleFileClick(e, id) {
            e.stopPropagation();
            if (e.ctrlKey || e.metaKey) {
                if (selectedFileIds.has(id)) selectedFileIds.delete(id);
                else selectedFileIds.add(id);
            } else {
                selectedFileIds.clear();
                selectedFileIds.add(id);
            }
            renderAll();
        }

        async function handleDoubleClick(id) {
            const file = allFiles.find(f => f.id === id);
            if (file && file.kind === 'directory') {
                historyHandles.push(dirHandle);
                dirHandle = file.handle;
                await refreshFiles();
            }
        }

        async function goBack() {
            if (historyHandles.length > 0) {
                dirHandle = historyHandles.pop();
                await refreshFiles();
            }
        }

        // --- File Operations ---

        async function createNewFolder() {
            if (!dirHandle || isSimulated) return;
            const name = prompt("ชื่อโฟลเดอร์ใหม่:");
            if (name) {
                await dirHandle.getDirectoryHandle(name, { create: true });
                await refreshFiles();
            }
        }

        async function deleteSelected() {
            if (!dirHandle || selectedFileIds.size === 0) return;
            if (!confirm(`ยืนยันการลบ ${selectedFileIds.size} รายการ?`)) return;
            
            for (const id of selectedFileIds) {
                await dirHandle.removeEntry(id, { recursive: true });
            }
            await refreshFiles();
        }

        async function batchRename() {
            if (selectedFileIds.size < 2) {
                alert("กรุณาเลือกไฟล์อย่างน้อย 2 ไฟล์");
                return;
            }
            const baseName = prompt("ใส่ชื่อหลัก (จะรันเลขลำดับต่อท้ายให้):", "Document");
            if (!baseName) return;

            let count = 1;
            const selected = Array.from(selectedFileIds).map(id => allFiles.find(f => f.id === id));
            
            for (const file of selected) {
                const ext = file.kind === 'file' ? `.${file.ext}` : '';
                const newName = `${baseName} (${count++})${ext}`;
                if (!isSimulated) await file.handle.move(newName);
            }
            await refreshFiles();
        }

        function setStatus(status) {
            selectedFileIds.forEach(id => {
                fileStatus[id] = status;
            });
            localStorage.setItem('pc_manager_status', JSON.stringify(fileStatus));
            renderAll();
        }

        // --- Helpers ---

        function getIcon(file, size = 18) {
            const s = size / 4;
            if (file.kind === 'directory') return `<i data-lucide="folder" class="w-${s} h-${s} text-amber-400 fill-amber-100"></i>`;
            if (['jpg', 'png', 'jpeg'].includes(file.ext)) return `<i data-lucide="file-image" class="w-${s} h-${s} text-emerald-500"></i>`;
            if (['js', 'html', 'py'].includes(file.ext)) return `<i data-lucide="file-code" class="w-${s} h-${s} text-indigo-500"></i>`;
            return `<i data-lucide="file-text" class="w-${s} h-${s} text-slate-400"></i>`;
        }

        function getStatusBadge(status, mini = false) {
            if (status === 'read') return `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full font-bold ${mini ? 'text-[8px]' : 'text-[10px]'}">อ่านแล้ว</span>`;
            if (status === 'edited') return `<span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full font-bold ${mini ? 'text-[8px]' : 'text-[10px]'}">แก้ไขแล้ว</span>`;
            return mini ? '' : `<span class="text-slate-300 text-[10px]">-</span>`;
        }

        function updateCounters() {
            const count = selectedFileIds.size;
            els.selectionCounter.innerText = `${count} เลือกอยู่`;
            els.selectionCounter.classList.toggle('hidden', count === 0);
            els.floatingActions.classList.toggle('hidden', count === 0);
            els.btnBatchRename.disabled = count < 2;
        }

        function updateUI() {
            if (dirHandle) {
                els.emptyState.classList.add('hidden');
                els.filesView.classList.remove('hidden');
                els.folderName.innerText = dirHandle.name;
                els.btnBack.disabled = historyHandles.length === 0;
                els.statusText.innerText = 'Active Sync';
                els.syncIndicator.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
            }
        }

        function clearSelection(e) {
            if (e.target.closest('tr') || e.target.closest('.grid-item')) return;
            selectedFileIds.clear();
            renderAll();
        }

        // --- Event Listeners ---
        els.btnConnect.addEventListener('click', connectPC);
        els.btnBack.addEventListener('click', goBack);
        els.btnNewFolder.addEventListener('click', createNewFolder);
        els.btnDeleteMulti.addEventListener('click', deleteSelected);
        els.btnBatchRename.addEventListener('click', batchRename);
        els.btnMarkRead.addEventListener('click', () => setStatus('read'));
        els.btnMarkEdited.addEventListener('click', () => setStatus('edited'));
        els.searchInput.addEventListener('input', renderAll);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'F2' && selectedFileIds.size === 1) {
                const id = Array.from(selectedFileIds)[0];
                const file = allFiles.find(f => f.id === id);
                const newName = prompt("ชื่อใหม่:", file.name);
                if (newName && !isSimulated) file.handle.move(newName).then(refreshFiles);
            }
            if (e.key === 'Delete' && selectedFileIds.size > 0) deleteSelected();
        });

        // Simulation for Preview
        els.btnSimulate.addEventListener('click', () => {
            isSimulated = true;
            dirHandle = { name: "โฟลเดอร์จำลอง" };
            allFiles = [
                { id: '1', name: 'รายงานปี 2567.pdf', kind: 'file', ext: 'pdf', size: '2.4 MB', updatedAt: 'วันนี้', status: 'read' },
                { id: '2', name: 'รูปภาพงานเลี้ยง.jpg', kind: 'file', ext: 'jpg', size: '5.1 MB', updatedAt: 'วานนี้', status: 'none' },
                { id: '3', name: 'เอกสารสำคัญ', kind: 'directory', size: '---', updatedAt: '---', status: 'none' }
            ];
            renderAll();
            updateUI();
        });

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
